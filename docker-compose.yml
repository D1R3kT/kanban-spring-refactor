services:
  postgres:
    image: postgres:16
    container_name: kanban-postgres
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
    ports:
      - "5432:5432"
    volumes:
      - kanban-pg-data:/var/lib/postgresql/data

volumes:
  kanban-pg-data: